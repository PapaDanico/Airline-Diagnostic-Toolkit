name: CI

on:
  # push is main-only on purpose. It used to include "claude/**", and
  # every branch with an open PR then ran the whole suite TWICE for one
  # commit — the push event and the pull_request event, same SHA, same
  # ~21 minutes of runner time, two sets of check runs on the PR for a
  # human to read. Neither was more authoritative than the other, so the
  # duplicate bought nothing but the chance of reading the stale one.
  #
  # Coverage is unchanged: pull_request covers every branch from the
  # moment it has a PR, which is the only point at which anyone is
  # reading the result, and push covers main so a merge is verified
  # against the merged tree rather than the pre-merge one.
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # find, not a glob. `assets/js/*.js` does not descend, so when the
      # inline scripts were extracted to assets/js/page/ it would have
      # left 122 kB of JS — most of every tool on the site — unparsed by
      # the one step whose job is parsing it.
      - name: JS syntax check
        run: |
          fail=0
          while IFS= read -r f; do
            echo "checking $f"
            node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(find assets/js scripts tests -name node_modules -prune -o \( -name '*.js' -o -name '*.mjs' \) -print)
          exit $fail
        shell: bash

      # Was "Validate host JSON config". That file is gone and _headers is
      # now the single policy source. This check points at manifest.json,
      # the JSON config this site actually ships and which a browser reads
      # silently; a parse error there costs installability with nothing on
      # screen to say so.
      - name: Validate manifest.json
        run: node -e "const m=JSON.parse(require('fs').readFileSync('manifest.json','utf8')); if(!Array.isArray(m.icons)||!m.icons.length) throw new Error('manifest declares no icons'); console.log('manifest.json OK -', m.icons.length, 'icons')"

      - name: Data-model integrity
        run: node scripts/check-data.mjs

      # glossary.html is pre-rendered from data-glossary.js and committed,
      # so the two can drift. Editing the data without rebuilding would
      # ship a page that silently disagrees with its own source of truth.
      - name: Generated glossary is in sync
        run: node scripts/build-glossary.mjs --check

      - name: HTML sanity
        run: |
          for f in *.html tools/*.html; do
            grep -q "</html>" "$f" || { echo "missing </html> in $f"; exit 1; }
            echo "ok $f"
          done

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test toolchain
        working-directory: tests
        run: npm install

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end behaviour tests
        run: node tests/e2e.mjs

      - name: Full-site page audit
        run: node tests/audit.mjs

      # e2e runs under file://, where no headers exist — so it can assert
      # what _headers says and never whether a browser honours it. This
      # serves the site with those headers applied and lets Chromium
      # enforce them, including a canary page whose inline script must be
      # blocked. A CSP that browsers silently drop as malformed passes
      # every other check in this repo and fails this one.
      - name: CSP enforced by a real browser
        run: node tests/csp.mjs

      # e2e tests focus MANAGEMENT — where focus goes. Nothing tested
      # focus VISIBILITY until this: whether a keyboard user can see
      # where it went. Its first run found a terracotta ring on the
      # terracotta ember band at 1.00:1, another at 1.90:1 on the
      # flagship card, and range sliders whose only indicator was a
      # 10%-alpha glow at 1.18:1.
      - name: Focus indicators are visible
        run: node tests/focus.mjs

      # manifest.json makes this site installable, and an installed thing
      # that shows a blank frame with no signal is worse than one that was
      # never installable. This closes the SERVER — setOffline() does not
      # apply to requests made inside a service worker — and then asks for
      # pages. It also guards the property that matters to everyone who is
      # NOT offline: nothing here is fingerprinted, so an online visit must
      # still reach the network or a deploy would serve stale assets.
      - name: The offline promise holds
        run: node tests/offline.mjs

      # Breadth to e2e's depth: every page and every tool driven under
      # the production headers, demanding only that nothing throws and
      # something renders. Catches the page nobody wrote a test for.
      - name: Drive every page as a user
        run: node tests/drive.mjs

      # Every storage call here is wrapped in a try/catch, correctly —
      # Safari private browsing throws on localStorage access itself.
      # But reads and writes were wrapped the same way, and a failed
      # write loses work: forty answers gone on reload, and a results
      # page telling the person who just answered all forty to "complete
      # all 40 questions first". This blocks storage in the browser and
      # requires the site to say so — and, in the paired control,
      # requires it to stay quiet when the write succeeds.
      - name: A refused storage write is reported
        run: node tests/storage.mjs
